[package]
name = "rustos-bootstrap-apps"
description = "Bootstrap ring-3 процессы и сервисы, устанавливаемые как RUNE"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rustos-init"
path = "src/init.rs"

[[bin]]
name = "rustos-fault-test"
path = "src/fault_test.rs"

[[bin]]
name = "rustos-preempt-a"
path = "src/preempt_a.rs"

[[bin]]
name = "rustos-preempt-b"
path = "src/preempt_b.rs"

[[bin]]
name = "rustos-ipc-receiver"
path = "src/ipc_receiver.rs"

[[bin]]
name = "rustos-ipc-sender"
path = "src/ipc_sender.rs"

[[bin]]
name = "rustos-abi-lifecycle"
path = "src/abi_lifecycle.rs"

[[bin]]
name = "rustos-abi-child"
path = "src/abi_child.rs"

[[bin]]
name = "rustos-vfsd"
path = "src/vfsd.rs"

[[bin]]
name = "rustos-displayd"
path = "src/displayd.rs"

[[bin]]
name = "rustos-compositord"
path = "src/compositord.rs"

[[bin]]
name = "rustos-renderd"
path = "src/renderd.rs"

[[bin]]
name = "rustos-vfs-test"
path = "src/vfs_test.rs"

[[bin]]
name = "rustos-vfs-persistence"
path = "src/vfs_persistence.rs"

[[bin]]
name = "rustos-loader-test"
path = "src/loader_test.rs"

[[bin]]
name = "rustos-loader-child"
path = "src/loader_child.rs"

[[bin]]
name = "rustos-rune-runner"
path = "src/rune_runner.rs"

[[bin]]
name = "rustos-std-smoke"
path = "src/std_smoke.rs"
required-features = ["std-port"]

[[bin]]
name = "rustos-std-main"
path = "src/std_main.rs"
required-features = ["std-port"]

[[bin]]
name = "rustos-std-child"
path = "src/std_child.rs"
required-features = ["std-port"]

[features]
default = []
std-port = []

[dependencies]
rustos-abi = { path = "../../abi" }
rustos-runtime = { path = "../../runtime" }
rustos-crt = { path = "../crt" }
rustos-vfs-client = { path = "../../libs/vfs" }
rustos-elf-loader = { path = "../../libs/elf-loader" }
rustos-rune-loader = { path = "../../libs/rune-loader" }
rustos-rune-format = { path = "../../rune-format" }
varaniafs = { path = "../../varaniafs" }
rustos-virgl = { path = "../../libs/virgl" }
