# RustOS GRUB configuration.
#
# Default mode starts with `auto`: GRUB asks the firmware video driver for the
# monitor's preferred EDID mode. The explicit list is a fallback for firmware
# that does not publish a preferred mode. All choices use a 32-bit pixel slot
# with 24 meaningful colour bits (XRGB/BGRX8888), which is faster than packed
# RGB888 for the CPU compositor.

set default=0
set timeout=2
set timeout_style=menu

insmod all_video
insmod efi_gop
insmod gfxterm
insmod serial

# GRUB diagnostics must remain visible even when a firmware cannot draw the
# selected mode. This is also the earliest observable point in headless CI.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_output gfxterm serial

function rustos_start {
    set gfxpayload=keep
    terminal_output gfxterm serial
    echo "RustOS: loading AMD64 microkernel through Multiboot2..."
    multiboot2 (memdisk)/boot/rustos/kernel.elf
    module2 (memdisk)/boot/rustos/initramfs.img initramfs
    boot
}

menuentry "RustOS — recommended widescreen 1600x900" {
    set gfxmode=1600x900x32,1920x1080x32,1366x768x32,1280x720x32,1280x800x32,auto
    rustos_start
}

menuentry "RustOS — automatic firmware/EDID mode" {
    set gfxmode=auto,1920x1080x32,1600x900x32,1366x768x32,1280x720x32,1280x800x32
    rustos_start
}

menuentry "RustOS — Full HD 1920x1080" {
    set gfxmode=1920x1080x32,1600x900x32,1280x720x32,auto
    rustos_start
}

menuentry "RustOS — widescreen 1600x900" {
    set gfxmode=1600x900x32,1366x768x32,1280x720x32,auto
    rustos_start
}

menuentry "RustOS — HD 1280x720" {
    set gfxmode=1280x720x32,1280x800x32,auto
    rustos_start
}
