# RustOS — учебная 64-битная микроядерная операционная система.
#
# Workspace делится на четыре «мира»:
#   * no_std миры (`targets/*-unknown-rustos.json`): ядро, runtime, сервисы,
#     драйверы и приложения для AMD64/AArch64;
#   * UEFI-мир (`x86_64-unknown-uefi`, `aarch64-unknown-uefi`): загрузчик;
#   * host-мир (native target): инструменты mkfs/image и хост-тесты.
#
# Все версии зависимостей зафиксированы жёстко (оператор `=`) — см. Cargo.lock.
[workspace]
resolver = "2"
members = [
    "abi",
    "microkernel",
    "video",
    "system-ui",
    "system-assets",
    "runtime",
    "userspace/crt",
    "sdk/examples/hello",
    "varaniafs",
    "libs/vfs",
    "libs/vfs-dll",
    "libs/elf-loader",
    "libs/rune-loader",
    "libs/virgl",
    "libs/loader-fixture",
    "libs/loader-root",
    "rune-format",
    "userspace/bootstrap",
    "kernel",
    "boot/uefi",
    "tools/image",
    "tools/pack",
    "tools/gui-check",
    "tools/hmp",
    "tools/vfs-image",
    "tools/rune",
    "tools/rui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VladimirKraswov/rustos"
authors = ["Vladimir Krasov <vladimirkrasov.ex@gmail.com>"]

[workspace.dependencies]
# UEFI-интерфейс для загрузчика. Ключевая логика (ELF-загрузка, page tables,
# BootInfo) написана вручную в boot/uefi и не спрятана в этот crate.
uefi = "=0.36.1"
# Логирование загрузчика (уходит в UEFI ConOut). Уровень — debug, чтобы
# видеть полный trace при сборке в dev-профиле.
log = { version = "=0.4.22", default-features = false, features = ["max_level_debug"] }

[profile.dev]
# debuginfo нужен для GDB, но opt-level=1 заметно ускоряет TCG-запуск в QEMU.
opt-level = 1
# LLVM incremental CGU cache некорректно теряет anonymous constants, когда
# kernel object содержит одновременно `.code16/.code32/.code64` AP trampoline.
# Для системного образа полная детерминированная линковка важнее этой экономии.
incremental = false

[profile.release]
opt-level = 2
debug = true
lto = "thin"
strip = "none"
