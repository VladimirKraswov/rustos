[package]
name = "rustos-rune"
description = "Конвертер ELF64/PIC в нативный контейнер RUNE и verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
# `rustos` задаётся нашим JSON target spec и ещё не входит в встроенный
# список rustc. Явная декларация сохраняет полезный check-cfg без шума при
# host-сборке конвертера.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("rustos"))'] }

[dependencies]
rustos-rune-format = { path = "../../rune-format" }

[target.'cfg(target_os = "rustos")'.dependencies]
rustos-crt = { path = "../../userspace/crt" }
