[package]
name = "rustos-kernel"
description = "Микроядро RustOS: CPU, память, прерывания, scheduler, IPC, capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rustos-kernel"
path = "src/main.rs"

[dependencies]
rustos-abi = { path = "../abi" }
rustos-microkernel = { path = "../microkernel" }
rustos-rune-format = { path = "../rune-format" }
rustos-system-assets = { path = "../system-assets" }
rustos-system-ui = { path = "../system-ui" }
rustos-video = { path = "../video" }
rustos-usb = { path = "../usb" }
embedded-graphics = { version = "=0.8.2", default-features = false }
mplusfonts = { version = "=0.3.4" }
u8g2-fonts = { version = "=0.8.0" }

[features]
default = []
# Автоматический QEMU boot-test завершается через isa-debug-exit. Обычная
# сборка без feature запускает интерактивный GUI-сеанс.
boot-test = []
# Останавливается сразу после ring-3 VirGL кадра, чтобы integration test мог
# снять scanout до запуска kernel recovery desktop.
virgl-test = []
